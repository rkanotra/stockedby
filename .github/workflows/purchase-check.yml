name: Purchase Check worker
on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"
concurrency:
  group: purchase-check-worker
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  checks:
    if: vars.PURCHASE_CHECK_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/purchase-check-worker.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PURCHASE_CHECK_BATCH_SIZE: 3
